name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 2222 -H 187.77.177.77 >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh -p 2222 -o StrictHostKeyChecking=no -o IdentitiesOnly=yes deploy@187.77.177.77 << 'EOF'
          set -e

          cd /var/www/portfolio

          git fetch origin main
          git reset --hard origin/main

          EOF
